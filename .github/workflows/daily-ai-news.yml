name: 每日 AI 圈早报自动生成

on:
  # UTC 23:48 = 北京时间每天早上 07:48 启动（避开整点排队高峰，确保 08:30 前准时生成完毕）
  schedule:
    - cron: '48 23 * * *'
  # 支持在 GitHub Actions 页面随时一键手动触发测试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-daily-ai-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库最新内容
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 Python 3.12 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 搜集前一日 AI 圈动态并生成 Top 20 总结报告
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python3 .automation/generate_daily_report.py

      - name: 提交并推送今日早报到仓库
        run: |
          git config user.name "AI-Daily-Report-Bot"
          git config user.email "actions@github.com"
          git add -A "*.md"
          if git diff --staged --quiet; then
            echo "今日早报无变化，跳过提交。"
          else
            REPORT_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
            git commit -m "🗞️ 自动生成 ${REPORT_DATE} AI 圈每日早报"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
